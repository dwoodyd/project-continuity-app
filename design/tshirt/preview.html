<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Still Worth The Build — T-shirt Preview</title>
<style>
  :root {
    --shirt: #f4ede2;     /* natural / cream tee */
    --shirt-dark: #1b1b1b; /* black tee option */
    --ink: #111;
    --bg: #2a2a2a;
  }
  html, body { margin: 0; background: var(--bg); color: #eee; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding: 24px 32px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
  header p  { margin: 0; opacity: .7; font-size: 13px; }
  .controls { margin-left: auto; display: flex; gap: 8px; }
  .controls button {
    background: #444; color: #fff; border: 1px solid #666; padding: 6px 12px;
    font: inherit; font-size: 12px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
  }
  .controls button.active { background: #fff; color: #111; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px 32px 48px; }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }
  .tee {
    position: relative; aspect-ratio: 5/6; border-radius: 16px;
    background: var(--shirt);
    box-shadow: inset 0 -60px 120px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.4);
    overflow: hidden;
  }
  body.dark .tee { background: var(--shirt-dark); }
  /* Faux collar */
  .tee::before {
    content: ""; position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 28%; height: 6%;
    border-bottom-left-radius: 50% 100%; border-bottom-right-radius: 50% 100%;
    background: rgba(0,0,0,.08);
  }
  body.dark .tee::before { background: rgba(255,255,255,.06); }
  /* Faux sleeves */
  .tee::after {
    content: ""; position: absolute; inset: 6% 0 0 0;
    background:
      radial-gradient(120% 60% at 0% 0%, rgba(0,0,0,.05), transparent 40%),
      radial-gradient(120% 60% at 100% 0%, rgba(0,0,0,.05), transparent 40%);
    pointer-events: none;
  }
  .label { position: absolute; left: 16px; top: 16px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(0,0,0,.5); }
  body.dark .label { color: rgba(255,255,255,.5); }
  .art { position: absolute; left: 12%; right: 12%; top: 14%; bottom: 8%; display: flex; align-items: center; justify-content: center; }
  .art svg { width: 100%; height: 100%; }
  body.dark .art svg { color: #f4ede2 !important; }
</style>
</head>
<body>
<header>
  <h1>Still Worth The Build</h1>
  <p>Front &amp; back preview — single-color screen-print ready</p>
  <div class="controls">
    <button id="lightBtn" class="active" type="button">Cream tee</button>
    <button id="darkBtn"  type="button">Black tee</button>
  </div>
</header>
<section class="stage">
  <div class="tee">
    <div class="label">Front</div>
    <div class="art"><object type="image/svg+xml" data="front.svg" aria-label="Front design"></object></div>
  </div>
  <div class="tee">
    <div class="label">Back</div>
    <div class="art"><object type="image/svg+xml" data="back.svg" aria-label="Back design"></object></div>
  </div>
</section>
<script>
  const light = document.getElementById('lightBtn');
  const dark  = document.getElementById('darkBtn');
  light.addEventListener('click', () => { document.body.classList.remove('dark'); light.classList.add('active'); dark.classList.remove('active'); });
  dark .addEventListener('click', () => { document.body.classList.add('dark');    dark .classList.add('active'); light.classList.remove('active'); });
</script>
</body>
</html>
