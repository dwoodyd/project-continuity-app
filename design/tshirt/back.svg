<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400" role="img" aria-labelledby="title desc">
  <title id="title">Still Worth It, Still Building — Back</title>
  <desc id="desc">T-shirt back graphic: "Still worth it, still building."</desc>

  <defs>
    <pattern id="hatch-back" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="currentColor" stroke-width="2"/>
    </pattern>

    <symbol id="brandmark-back" viewBox="-100 -100 200 200">
      <path d="M 0 55
               C -10 35, -55 25, -55 -10
               C -55 -45, -25 -55, 0 -25
               C 25 -55, 55 -45, 55 -10
               C 55 25, 10 35, 0 55 Z"
            fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
      <g stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <line x1="-35" y1="-35" x2="45" y2="45"/>
        <rect x="-78" y="-66" width="52" height="26" transform="rotate(-45 -52 -53)" fill="currentColor"/>
      </g>
    </symbol>
  </defs>

  <g color="#111111" font-family="'Impact', 'Oswald', 'Bebas Neue', 'Arial Black', sans-serif" text-anchor="middle">

    <!-- Top frame: long horizontal bar with brackets -->
    <g stroke="currentColor" stroke-width="6" fill="none">
      <line x1="180" y1="220" x2="1020" y2="220"/>
      <polyline points="180,200 160,200 160,240 180,240"/>
      <polyline points="1020,200 1040,200 1040,240 1020,240"/>
    </g>

    <text x="600" y="290" font-size="44" letter-spacing="22" fill="currentColor"
          font-family="'Courier New', monospace" font-weight="bold">
      A PERSONAL MOTTO
    </text>

    <!-- Hero stack: STILL / WORTH IT, / STILL / BUILDING -->
    <text x="600" y="500" font-size="240" font-weight="900" fill="currentColor"
          letter-spacing="12">STILL</text>

    <!-- WORTH IT — hatched hero word with comma -->
    <g>
      <text x="600" y="700" font-size="220" font-weight="900" fill="url(#hatch-back)" stroke="currentColor"
            stroke-width="6" letter-spacing="10">WORTH IT,</text>
    </g>

    <!-- Center divider with brand mark -->
    <g transform="translate(600 820)">
      <line x1="-380" y1="0" x2="-110" y2="0" stroke="currentColor" stroke-width="5"/>
      <line x1="110" y1="0" x2="380" y2="0" stroke="currentColor" stroke-width="5"/>
      <use href="#brandmark-back" x="-70" y="-70" width="140" height="140"/>
    </g>

    <text x="600" y="990" font-size="240" font-weight="900" fill="currentColor"
          letter-spacing="12">STILL</text>

    <text x="600" y="1180" font-size="200" font-weight="900" fill="currentColor"
          letter-spacing="10">BUILDING.</text>

    <!-- Bottom frame -->
    <g stroke="currentColor" stroke-width="6" fill="none">
      <line x1="180" y1="1260" x2="1020" y2="1260"/>
      <polyline points="180,1240 160,1240 160,1280 180,1280"/>
      <polyline points="1020,1240 1040,1240 1040,1280 1020,1280"/>
    </g>

    <text x="600" y="1340" font-size="36" letter-spacing="16" fill="currentColor"
          font-family="'Courier New', monospace" font-weight="bold">
      / / KEEP&#8201;GOING / /
    </text>
  </g>
</svg>
