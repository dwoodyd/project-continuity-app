<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Continuary</title>
    <meta name="description" content="Your personal continuity system — stay in motion on what matters." />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (browser chrome on Android) -->
    <meta name="theme-color" content="#1B2A4A" />
    <meta name="msapplication-TileColor" content="#1B2A4A" />
    <meta name="msapplication-TileImage" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/VnvNaoJZPVnHWmB8F3cwwo/icon-144_54399d3f.png" />

    <!-- iOS PWA: full-screen standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Continuary" />

    <!-- iOS icons (Apple ignores manifest icons; these are required separately) -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/VnvNaoJZPVnHWmB8F3cwwo/icon-180_af0a0664.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/VnvNaoJZPVnHWmB8F3cwwo/icon-152_b96a6a71.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/VnvNaoJZPVnHWmB8F3cwwo/icon-144_54399d3f.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/VnvNaoJZPVnHWmB8F3cwwo/icon-128_3e9beb17.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/VnvNaoJZPVnHWmB8F3cwwo/icon-32_0638d420.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/VnvNaoJZPVnHWmB8F3cwwo/icon-16_2464b37a.png" />
    <link rel="shortcut icon" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/VnvNaoJZPVnHWmB8F3cwwo/icon-32_0638d420.png" />

    <!-- iOS splash screens (optional but improves launch experience) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Continuary" />
    <meta property="og:title" content="Continuary — Permission to Start" />
    <meta property="og:description" content="Your personal continuity system. Stay in motion on what matters — even when starting feels impossible." />
    <meta property="og:url" content="https://continuary.soulengineer.online/welcome" />
    <meta property="og:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/VnvNaoJZPVnHWmB8F3cwwo/continuary-og-image_55856216.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Continuary — Permission to Start" />
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Continuary — Permission to Start" />
    <meta name="twitter:description" content="Your personal continuity system. Stay in motion on what matters — even when starting feels impossible." />
    <meta name="twitter:image" content="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/VnvNaoJZPVnHWmB8F3cwwo/continuary-og-image_55856216.png" />
    <meta name="twitter:image:alt" content="Continuary — Permission to Start" />

    <!-- Anti-flash theme: apply saved theme class synchronously before first paint -->
    <script>
      (function(){
        try{
          var t=localStorage.getItem('theme');
          // Default to dark for new users (app default)
          if(t==='dark'||!t) document.documentElement.classList.add('dark');
        }catch(e){}
      })();
    </script>

    <!-- Fonts: Inter (UI) + Lora (brand serif for wordmark/headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
