<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Continuary — Built for Minds That Work Differently</title>
    <meta name="description" content="Finally, a system that keeps up with you. Built for ADHD, focus struggles, and non-linear thinkers who lose the thread." />
    <meta name="keywords" content="ADHD productivity, neurodivergent focus, continuity system, daily check-in, project momentum, non-linear work" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (browser chrome on Android) -->
    <meta name="theme-color" content="#1B2A4A" />
    <meta name="msapplication-TileColor" content="#1B2A4A" />
    <meta name="msapplication-TileImage" content="/icon-128.png" />

    <!-- iOS PWA: full-screen standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Continuary" />

    <!-- iOS icons (Apple ignores manifest icons; these are required separately) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icon-128.png" />

    <!-- Multi-resolution .ico for legacy browsers and bookmark bars -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- Favicon (border-free, tight crop) -->
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="shortcut icon" href="/icon-96.png" />

    <!-- iOS splash screens (optional but improves launch experience) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Continuary" />
    <meta property="og:title" content="Continuary — Built for Minds That Work Differently" />
    <meta property="og:description" content="Finally, a system that keeps up with you. Built for ADHD, focus struggles, and non-linear thinkers who lose the thread." />
    <meta property="og:url" content="https://app.continuary.app/" />
    <meta property="og:image" content="https://app.continuary.app/manus-storage/og-card_d230073e.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Continuary — Finally, a system that keeps up with you." />
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Continuary — Built for Minds That Work Differently" />
    <meta name="twitter:description" content="Finally, a system that keeps up with you. Built for ADHD, focus struggles, and non-linear thinkers who lose the thread." />
    <meta name="twitter:image" content="https://app.continuary.app/manus-storage/og-card_d230073e.jpg" />
    <meta name="twitter:image:alt" content="Continuary — Finally, a system that keeps up with you." />

    <!-- Structured data: WebApplication schema for machine-readable app context -->

    <!-- FAQPage schema for AI crawler discovery (Bing, Perplexity, ChatGPT RAG) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What happens after the founding slots fill?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Once all 100 founding slots are claimed, pricing moves to retail rates ($7.99/mo Pro, $14.99/mo Keeper). Founding members keep their rate locked for as long as they stay subscribed — it never increases."
          }
        },
        {
          "@type": "Question",
          "name": "Can I cancel anytime?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Cancel from Settings at any time — no penalty, no questions. You keep access until the end of your current billing period."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a free tier?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Core daily tools — check-ins, Today dashboard, projects, Scratch Pad, Evidence Log, and Emotional Cycle — are always free. Pro and Keeper unlock Wren AI, voice capture, vault storage, and advanced features."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between Pro and Keeper?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pro gives you Wren AI, voice dictation, the full Clarity Engine, and weekly review letters. Keeper adds the file vault, advanced co-working tools, and the Weekly Compass deep-dive. Both tiers include everything in Free."
          }
        },
        {
          "@type": "Question",
          "name": "Is Continuary a therapy app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Wren is a productivity companion, not a clinician. Continuary helps you build structure and continuity — it is not a substitute for therapy, medication, or professional mental health support."
          }
        },
        {
          "@type": "Question",
          "name": "Does Continuary work on mobile?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Continuary is a progressive web app (PWA) — install it from your browser on iOS or Android for a native-feeling experience with offline support and push notifications."
          }
        }
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Continuary",
      "url": "https://app.continuary.app/",
      "description": "A structured daily workspace for ADHD, focus struggles, and non-linear thinkers. Collect evidence of your identity as someone who keeps going.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web, iOS, Android",
      "browserRequirements": "Requires JavaScript. Works best in Chrome, Safari, Firefox, Edge.",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free tier — always available, no credit card required."
        },
        {
          "@type": "Offer",
          "name": "Pro (Founding Rate)",
          "price": "4.99",
          "priceCurrency": "USD",
          "description": "Pro founding rate — locked for life. Limited to 100 founding members."
        },
        {
          "@type": "Offer",
          "name": "Keeper (Founding Rate)",
          "price": "9.99",
          "priceCurrency": "USD",
          "description": "Keeper founding rate — locked for life. Includes all Pro features plus vault and advanced AI."
        }
      ],
      "creator": {
        "@type": "Organization",
        "name": "Continuary",
        "url": "https://app.continuary.app/"
      }
    }
    </script>

    <!-- Fonts: Space Grotesk (headings) + Inter (UI/body) + DM Mono (timestamps/log/accents) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
