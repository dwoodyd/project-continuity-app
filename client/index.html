<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Continuary</title>
    <meta name="description" content="Built for ADHD, focus struggles, and non-linear thinkers. Continuary keeps your thread — so you always know where you are, even after days away." />
    <meta name="keywords" content="ADHD productivity, neurodivergent focus, continuity system, daily check-in, project momentum, non-linear work" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (browser chrome on Android) -->
    <meta name="theme-color" content="#1B2A4A" />
    <meta name="msapplication-TileColor" content="#1B2A4A" />
    <meta name="msapplication-TileImage" content="/icon-128.png" />

    <!-- iOS PWA: full-screen standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Continuary" />

    <!-- iOS icons (Apple ignores manifest icons; these are required separately) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icon-128.png" />

    <!-- Multi-resolution .ico for legacy browsers and bookmark bars -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- Favicon (border-free, tight crop) -->
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="shortcut icon" href="/icon-96.png" />

    <!-- iOS splash screens (optional but improves launch experience) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Continuary" />
    <meta property="og:title" content="Continuary — Built for Minds That Work Differently" />
    <meta property="og:description" content="Finally, a system that keeps up with you. Built for ADHD, focus struggles, and non-linear thinkers who need structure that works with how they actually think." />
    <meta property="og:url" content="https://continuary.app/" />
    <meta property="og:image" content="https://files.manuscdn.com/user_upload_by_module/session_file/310519663270045694/gwAeMnUwxfmRlOyt.jpg?v=5" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Continuary — Finally, a system that keeps up with you." />
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Continuary — Built for Minds That Work Differently" />
    <meta name="twitter:description" content="Finally, a system that keeps up with you. Built for ADHD, focus struggles, and non-linear thinkers who need structure that works with how they actually think." />
    <meta name="twitter:image" content="https://files.manuscdn.com/user_upload_by_module/session_file/310519663270045694/gwAeMnUwxfmRlOyt.jpg?v=5" />
    <meta name="twitter:image:alt" content="Continuary — Finally, a system that keeps up with you." />

    <!-- Anti-flash theme: apply saved theme class synchronously before first paint -->
    <script>
      (function(){
        try{
          var t=localStorage.getItem('theme');
          // Default to dark for new users (app default)
          if(t==='dark'||!t) document.documentElement.classList.add('dark');
        }catch(e){}
      })();
    </script>

    <!-- Fonts: Inter (UI) + Playfair Display (brand serif for display headlines) + Lora (fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics: only injected when both env vars are set at build time -->
    <script>
      (function(){
        var ep = "%VITE_ANALYTICS_ENDPOINT%";
        var id = "%VITE_ANALYTICS_WEBSITE_ID%";
        // Vite leaves the literal placeholder string when the var is undefined.
        // Guard: skip injection if either value is still a raw placeholder.
        if (!ep || ep.indexOf('%') === 0 || !id || id.indexOf('%') === 0) return;
        var s = document.createElement('script');
        s.defer = true;
        s.src = ep + '/umami';
        s.setAttribute('data-website-id', id);
        document.body.appendChild(s);
      })();
    </script>
  </body>

</html>
